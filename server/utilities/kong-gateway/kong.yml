# Kong declarative configuration for the Wiseape stack (Kong 3.x, DB mode).
#
# Apply to a running Kong (idempotent; creates, updates AND deletes so that Kong
# matches this file exactly):
#   docker compose --profile tools run --rm deck
# See README.md for the other ways to load it.
#
# Upstreams use host.docker.internal because Kong runs in a container: "localhost"
# there would be the Kong container itself, not the machine running the services.
_format_version: "3.0"

services:
  - name: WASAPI              # Wiseape Application System API  (server/applications/WiseapeApplicationSystem)
    protocol: http
    host: host.docker.internal
    port: 4000
    tags: [wiseape-service]
    routes:
      - name: WASAPI
        paths: [/was]
        strip_path: true      # /was/api/apps -> /api/apps

  - name: HRISAPI             # HRIS API                        (server/applications/HRIS)
    protocol: http
    host: host.docker.internal
    port: 4001
    routes:
      - name: hris-api-route
        paths: [/hris]
        strip_path: true

  - name: REPORTAPI           # Report Designer API             (server/applications/ReportDesigner)
    protocol: http
    host: host.docker.internal
    port: 4002
    routes:
      - name: report-api-route
        paths: [/report]
        strip_path: true

  - name: WISEDESKTOPAPI      # Client Express server (desktop shell, :3000); used by the Vite dev proxy
    protocol: http
    host: host.docker.internal
    port: 3000
    routes:
      - name: wise-desktop-route
        paths: [/desktop]
        strip_path: true

  - name: UTILITIESAPI        # Utilities API (Kong/Kafka manager links)  (server/applications/Utilities)
    protocol: http
    host: host.docker.internal
    port: 4003
    routes:
      - name: utilities-api-route
        paths: [/utilities]
        strip_path: true

  # ---- Web UIs shown inside the app (WiseWebView) ------------------------------------------
  # These tools send X-Frame-Options (DENY / sameorigin), which makes browsers refuse to embed
  # them. They are reached through Kong on their own host names (*.localhost resolves to
  # 127.0.0.1 in browsers, so each UI keeps its own origin and root-relative asset paths work)
  # and the header is removed on the way out. The Kong proxy port is bound to 127.0.0.1 in
  # docker-compose.yml so these UIs are not exposed to the network.
  - name: KONGMANAGER         # Kong Manager (admin GUI listener inside the Kong container)
    protocol: http
    host: localhost
    port: 8002
    routes:
      - name: kong-manager-ui
        hosts: [kong-manager.localhost]
        paths: [/]
        strip_path: false
    plugins:
      - name: response-transformer
        config:
          remove:
            headers: [X-Frame-Options]

  - name: KAFKAUI             # Kafka UI (server/utilities/kafka, published on 127.0.0.1:8085)
    protocol: http
    host: host.docker.internal
    port: 8085
    routes:
      - name: kafka-ui
        hosts: [kafka-ui.localhost]
        paths: [/]
        strip_path: false
    plugins:
      - name: response-transformer
        config:
          remove:
            headers: [X-Frame-Options]
