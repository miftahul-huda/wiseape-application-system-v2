services:
  kong-db:
    image: postgres:16
    container_name: kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kongpass   # ganti dengan password kuat
    volumes:
      - kong_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kong-migrations:
    image: kong:3.9
    command: kong migrations bootstrap
    environment: &kong-env
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-db
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kongpass
      KONG_PG_DATABASE: kong
    depends_on:
      kong-db:
        condition: service_healthy
    restart: "no"

  kong:
    image: kong:3.9
    container_name: kong
    environment:
      <<: *kong-env
      KONG_PROXY_LISTEN: 0.0.0.0:8000, 0.0.0.0:8443 ssl
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
      KONG_ADMIN_GUI_LISTEN: 0.0.0.0:8002
      # Kong Manager is opened (embedded) through the proxy at kong-manager.localhost:8000 (see
      # kong.yml); the Admin API only accepts CORS calls from this origin, so it must match.
      KONG_ADMIN_GUI_URL: http://kong-manager.localhost:8000
      KONG_ADMIN_GUI_API_URL: http://localhost:8001
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
    ports:
      - "127.0.0.1:8000:8000"   # Proxy HTTP  (local only: it also serves Kong Manager / Kafka UI)
      - "127.0.0.1:8443:8443"   # Proxy HTTPS (local only)
      - "127.0.0.1:8001:8001"   # Admin API (hanya lokal)
      - "127.0.0.1:8002:8002"   # Kong Manager (hanya lokal)
    depends_on:
      kong-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # One-shot helper that loads kong.yml into Kong (decK). Not started by `up`:
  #   docker compose --profile tools run --rm deck
  deck:
    image: kong/deck:v1.68.0
    profiles: ["tools"]
    command: gateway sync /config/kong.yml --kong-addr http://kong:8001
    volumes:
      - ./kong.yml:/config/kong.yml:ro
    depends_on:
      kong:
        condition: service_healthy
    restart: "no"

volumes:
  kong_data: