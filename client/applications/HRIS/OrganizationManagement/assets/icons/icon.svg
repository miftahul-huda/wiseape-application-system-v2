<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="orgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
  </defs>

  <!-- Background squircle -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#orgBg)"/>

  <!-- Organization Tree Nodes -->
  <!-- Top Node (Executive / Head) -->
  <rect x="48" y="24" width="32" height="20" rx="5" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.2))"/>
  <circle cx="64" cy="34" r="5" fill="#059669"/>

  <!-- Connecting Lines -->
  <path d="M64 44 L64 56" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>
  <path d="M36 56 L92 56" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>
  <path d="M36 56 L36 68" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>
  <path d="M64 56 L64 68" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>
  <path d="M92 56 L92 68" stroke="#a7f3d0" stroke-width="3" stroke-linecap="round"/>

  <!-- Bottom Left Node -->
  <rect x="22" y="68" width="28" height="18" rx="4" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))"/>
  <rect x="26" y="74" width="20" height="6" rx="2" fill="#10b981"/>

  <!-- Bottom Center Node -->
  <rect x="50" y="68" width="28" height="18" rx="4" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))"/>
  <rect x="54" y="74" width="20" height="6" rx="2" fill="#10b981"/>

  <!-- Bottom Right Node -->
  <rect x="78" y="68" width="28" height="18" rx="4" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.15))"/>
  <rect x="82" y="74" width="20" height="6" rx="2" fill="#10b981"/>

  <!-- Badge Indicator / Structure Level -->
  <circle cx="94" cy="94" r="14" fill="#3b82f6" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M90 94 L93 97 L98 90" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
