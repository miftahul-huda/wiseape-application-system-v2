<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="hrisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1e3a8a" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#hrisBg)" filter="url(#shadow)" />

  <!-- Inner subtle border -->
  <rect x="9" y="9" width="110" height="110" rx="25" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Corporate Building & People Icon Combination -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Center Building -->
    <path d="M40 94 V44 A4 4 0 0 1 44 40 H84 A4 4 0 0 1 88 44 V94 Z" fill="rgba(255,255,255,0.12)" />
    
    <!-- Building Windows Grid -->
    <line x1="52" y1="50" x2="56" y2="50" stroke="#93c5fd" stroke-width="4" />
    <line x1="72" y1="50" x2="76" y2="50" stroke="#93c5fd" stroke-width="4" />
    <line x1="52" y1="62" x2="56" y2="62" stroke="#93c5fd" stroke-width="4" />
    <line x1="72" y1="62" x2="76" y2="62" stroke="#93c5fd" stroke-width="4" />
    <line x1="52" y1="74" x2="56" y2="74" stroke="#93c5fd" stroke-width="4" />
    <line x1="72" y1="74" x2="76" y2="74" stroke="#93c5fd" stroke-width="4" />

    <!-- Main Door Entrance -->
    <path d="M58 94 V82 A3 3 0 0 1 61 79 H67 A3 3 0 0 1 70 82 V94" fill="#ffffff" stroke="#ffffff" stroke-width="2" />

    <!-- Left Wing -->
    <path d="M26 94 V58 A3 3 0 0 1 29 55 H40 V94" fill="rgba(255,255,255,0.06)" />
    <line x1="33" y1="65" x2="35" y2="65" stroke="#93c5fd" stroke-width="3" />
    <line x1="33" y1="75" x2="35" y2="75" stroke="#93c5fd" stroke-width="3" />

    <!-- Right Wing -->
    <path d="M88 94 V58 A3 3 0 0 1 91 55 H102 V94" fill="rgba(255,255,255,0.06)" />
    <line x1="93" y1="65" x2="95" y2="65" stroke="#93c5fd" stroke-width="3" />
    <line x1="93" y1="75" x2="95" y2="75" stroke="#93c5fd" stroke-width="3" />

    <!-- Foundation Line -->
    <line x1="20" y1="94" x2="108" y2="94" stroke="#ffffff" stroke-width="5" />
  </g>

  <!-- Glowing Badge on top right (HR / Team emblem) -->
  <circle cx="86" cy="34" r="14" fill="#38bdf8" />
  <circle cx="86" cy="30" r="4.5" fill="#ffffff" />
  <path d="M78 43 C78 39 81 37 86 37 C91 37 94 39 94 43" fill="#ffffff" />
</svg>
