<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="hrisBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Background edge-to-edge squircle (no outer border or inset) -->
  <rect x="0" y="0" width="128" height="128" rx="28" fill="url(#hrisBg)"/>

  <!-- Corporate Building & People Icon Combination -->
  <g fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main Center Building -->
    <path d="M40 96 V44 A4 4 0 0 1 44 40 H84 A4 4 0 0 1 88 44 V96 Z" fill="rgba(255,255,255,0.12)" />
    
    <!-- Building Windows Grid -->
    <line x1="52" y1="51" x2="56" y2="51" stroke="#93c5fd" stroke-width="4" />
    <line x1="72" y1="51" x2="76" y2="51" stroke="#93c5fd" stroke-width="4" />
    <line x1="52" y1="63" x2="56" y2="63" stroke="#93c5fd" stroke-width="4" />
    <line x1="72" y1="63" x2="76" y2="63" stroke="#93c5fd" stroke-width="4" />
    <line x1="52" y1="75" x2="56" y2="75" stroke="#93c5fd" stroke-width="4" />
    <line x1="72" y1="75" x2="76" y2="75" stroke="#93c5fd" stroke-width="4" />

    <!-- Main Door Entrance -->
    <path d="M58 96 V84 A3 3 0 0 1 61 81 H67 A3 3 0 0 1 70 84 V96" fill="#ffffff" stroke="#ffffff" stroke-width="2" />

    <!-- Left Wing -->
    <path d="M25 96 V58 A3 3 0 0 1 28 55 H40 V96" fill="rgba(255,255,255,0.06)" />
    <line x1="32" y1="66" x2="34" y2="66" stroke="#93c5fd" stroke-width="3" />
    <line x1="32" y1="76" x2="34" y2="76" stroke="#93c5fd" stroke-width="3" />

    <!-- Right Wing -->
    <path d="M88 96 V58 A3 3 0 0 1 91 55 H103 V96" fill="rgba(255,255,255,0.06)" />
    <line x1="94" y1="66" x2="96" y2="66" stroke="#93c5fd" stroke-width="3" />
    <line x1="94" y1="76" x2="96" y2="76" stroke="#93c5fd" stroke-width="3" />

    <!-- Foundation Line -->
    <line x1="18" y1="96" x2="110" y2="96" stroke="#ffffff" stroke-width="4.5" />
  </g>

  <!-- Glowing Badge on top right (HR / Team emblem) -->
  <circle cx="86" cy="34" r="14" fill="#38bdf8" />
  <circle cx="86" cy="30" r="4.5" fill="#ffffff" />
  <path d="M78 43 C78 39 81 37 86 37 C91 37 94 39 94 43" fill="#ffffff" />
</svg>
